services:
  postgres:
    image: postgres:17-alpine
    container_name: musicpod-postgres

    environment:
      POSTGRES_DB: musicpod
      POSTGRES_USER: musicpod
      POSTGRES_PASSWORD: musicpod

    ports:
      - 5432:5432

    volumes:
      - musicpod_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U musicpod -d musicpod
      interval: 5s
      timeout: 5s
      retries: 10
    
  prometheus:
    image: prom/prometheus:v3.13.2

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    container_name: musicpod-grafana

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: musicpod-kafka

    ports:
      - 9092:9092

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: musicpod-redis

    ports:
      - 6379:6379

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: musicpod-opensearch

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

    ports:
      - 9200:9200
      - 9600:9600

    volumes:
      - musicpod_opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  musicpod_postgres_data:
  musicpod_opensearch_data:
  prometheus_data:
  grafana_data:
