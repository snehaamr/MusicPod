services:
  postgres:
    image: postgres:17-alpine
    container_name: musicpod-postgres

    environment:
      POSTGRES_DB: musicpod
      POSTGRES_USER: musicpod
      POSTGRES_PASSWORD: musicpod

    ports:
      - 5432:5432

    volumes:
      - musicpod_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U musicpod -d musicpod
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: musicpod-kafka

    ports:
      - 9092:9092

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: musicpod-redis

    ports:
      - 6379:6379

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: musicpod-opensearch

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

    ports:
      - 9200:9200
      - 9600:9600

    volumes:
      - musicpod_opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  musicpod_postgres_data:
  musicpod_opensearch_data:
