spring:
  application:
    name: musicpod-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musicpod}
    username: ${DB_USER:musicpod}
    password: ${DB_PASSWORD:musicpod}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

      properties:
        enable.idempotence: true

    consumer:
      group-id: musicpod-playback-analytics-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

      properties:
        spring.json.trusted.packages: com.musicpod.messaging.event

    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: ${JWT_ISSUER:musicpod}
    secret: ${JWT_SECRET:musicpod-local-development-jwt-secret-change-me-before-production-2026}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

  kafka:
    enabled: ${KAFKA_ENABLED:true}

  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:1000}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:20}