# Keep background infrastructure disabled for MCP protocol tests

app.kafka.enabled=false
app.ai.curator.enabled=false


# Enable the real MCP server only for M12E integration tests

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

spring.ai.mcp.server.name=musicpod
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.annotation-scanner.enabled=true

# We expose annotated MCP tools directly.
# Do not convert regular Spring AI ToolCallbacks into MCP tools.

spring.ai.mcp.server.tool-callback-converter=false


# Capabilities exposed by MusicPod

spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false


# Streamable HTTP endpoint

spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp


# Keep external AI providers disabled during integration tests

spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none